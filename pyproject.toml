[project]
name = "infra-id"
version = "0.0.0"
description = "Indonesia Infrastructure Atlas: curated data pipeline and offline site build"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4",
    "lxml",
    "shapely",
]

[dependency-groups]
dev = ["ruff>=0.17.4"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["data", "site"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
# Indonesian prose uses typographic dashes, quotes and non-ASCII units.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["data_model", "build_psn_ledger"]
