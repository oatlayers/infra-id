"message":"OK","data":{"xid":"T7K767GK","slug":"kek-arun-lhokseumawe","description":"\u003cp\u003eKEK Arun Lhokseumawe terletak di Kabupaten Aceh Utara dan Kota Lhokseumawe, Provinsi Aceh dan dibentuk berdasarkan Peraturan Pemerintah Nomor 5 Tahun 2017. KEK Arun Lhokseumawe diresmikan beroperasi oleh Presiden Republik Indonesia, Bapak Joko Widodo pada tanggal 14 Desember 2018. KEK ini berfokus pada beberapa sektor yaitu energi, petrokimia, agro industri pendukung ketahanan pangan, logistik serta industri penghasil kertas kraft. Dari sektor energi (minyak dan gas) akan dikembangkan regasifikasi LNG, LNG Hub/ Trading, LPG Hub/ Trading, Mini LNG Plant PLTG dengan pengembangan pembangkit listrik yang ramah lingkungan atau clean energy solution provider. Infrastruktur logistik juga dikembangkan untuk mendukung input dan output dari industri minyak dan gas, petrokimia dan agro industri, melalui peningkatan infrastruktur pelabuhan dan dermaga berstandar Internasional. Dengan potensi dan peluang yang dimiliki, KEK Arun Lhokseumawe diproyeksikan menarik investasi sebesar US$3,8 M dan diproyeksikan dapat menyerap tenaga kerja sebanyak 40.000 tenaga kerja hingga tahun 2027.\u003c/p\u003e","legalBasis":"Peraturan Pemerintah Nomor 5 Tahun 2017","imageFiles":{"desktop":{"url":"https://object.kek.go.id/ekon-kek-prod-bucket/sez-region-profile/image/8W9BoJaipbuVUMsEq5nNpOsPJMlnDU6SJvDpsUGV.jpg?X-Amz-Content-Sha256=UNSIGNED-PAYLOAD\u0026X-Amz-Algorithm=AWS4-HMAC-SHA256\u0026X-Amz-Credential=F83BDJnBXrZ3WHGbaupe%2F20261106%2Fap-southeast-1%2Fs3%2Faws4_request\u0026X-Amz-Date=20261106T023547Z\u0026X-Amz-SignedHeaders=host\u0026X-Amz-Expires=86400\u0026X-Amz-Signature=376013bf15b73e36a8a35d789a75654ef9f1ce70ba16303281fec315045afc15","fileName":"Master-Plan-Arun-L.jpg","signature":"","fileSize":645559},"tablet":{"url":"https://object.kek.go.id/ekon-kek-prod-bucket/sez-region-profile/image/8W9BoJaipbuVUMsEq5nNpOsPJMlnDU6SJvDpsUGV-tab.jpg?X-Amz-Content-Sha256=UNSIGNED-PAYLOAD\u0026X-Amz-Al
