-galang-batang"},"headers":{"Accept-Language":"id"}},"startedTimeStamp":1793965479991,"data":{"success":true,"code":"200","message":"OK","data":{"xid":"6PMG1FT2","slug":"kek-galang-batang","description":"\u003cp\u003e\u003cspan style=\"font-size: 10pt; font-family: Calibri, Arial;\" data-sheets-root=\"1\" data-sheets-value=\"{\u0026quot;1\u0026quot;:2,\u0026quot;2\u0026quot;:\u0026quot;Kawasan Ekonomi Khusus (KEK) Galang Batang berada di Pulau Bintan Kepulauan Riau, yang merupakan sentra choke point Selat Malaka. Lokasi KEK Galang Batang mempunyai akses langsung dengan Selat Malaka dan Laut China Selatan. KEK Galang Batang diusulkan oleh badan usaha PT GBKEK Industri Park dan ditetapkan melalui Peraturan Pemerintah Nomor 42 Tahun 2017, dan diresmikan beroperasinya oleh Menteri Koordinator Bidang Perekonomian, Bapak Darmin Nasution pada tanggal 8 Desember 2018.\\n\\nKEK Galang Batang akan dikembangkan sebagai sentra industri pengolahan mineral hasil tambang (bauksit) dan produk turunannya baik dari refinery maupun dari proses smelter. Diperkirakan KEK Galang Batang akan mampu menyerap tenaga kerja sebesar 23.200 orang, tersebar untuk industri pengolahan refinery sebesar 350 orang, industri pengolahan smelter sebesar 260 orang dan jasa dermaga serta pelabuhan yang berpotensi menciptakan kegiatan ikutan (multiplier effect) di kawasan tersebut. Adapun nilai investasi pembangunan KEK Galang Batang adalah sebesar Rp 36,25 Triliun hingga tahun 2027.\\n \u0026quot;}\" data-sheets-userformat=\"{\u0026quot;2\u0026quot;:4993,\u0026quot;3\u0026quot;:{\u0026quot;1\u0026quot;:0},\u0026quot;10\u0026quot;:2,\u0026quot;11\u0026quot;:4,\u0026quot;12\u0026quot;:0,\u0026quot;15\u0026quot;:\u0026quot;Calibri\u0026quot;}\"\u003eKawasan Ekonomi Khusus (KEK) Galang Batang berada di Pulau Bintan Kepulauan Riau, yang merupakan sentra choke point Selat Malaka. Lokasi KEK Galang Batang mempunyai akses langsung dengan Selat Malaka dan Laut China Selatan. KEK Galang Batang diusulkan oleh badan usaha PT GBKEK Industri Park dan ditetapkan melalui Peraturan Pemerintah Nomor 42 Tahun 2017, dan diresmikan beroperasinya oleh Menteri Koordinator Bidang Perekonomian, Bapak Darmin Nasution pada tanggal 8 Desember 2018.\u003cbr /\u003e\u003cbr /\u003eKEK Galang Batang akan dikembangkan sebagai sentra industri pengolahan mineral hasil tambang (bauksit) dan produk turunannya baik dari refinery maupun dari proses smelter. Diperkirakan KEK Galang Batang akan mampu menyerap tenaga kerja sebesar 23.200 orang, tersebar untuk industri pengolahan refinery sebesar 350 orang, industri pengolahan smelter sebesar 260 orang dan jasa dermaga serta pelabuhan yang berpotensi menciptakan kegiatan ikutan (multiplier effect) di kawasan tersebut. Adapun nilai investasi pembangunan KEK Galang Batang adalah sebesar Rp 36,25 Triliun hingga tahun 2027.\u003cbr /\u003e\u003c/span\u003e\u003c/p\u003e","legalBasis":"PP 42 tahun 2017","imageFiles":{"desktop":{"url":"https://object.kek.go.id/ekon-kek-prod-bucket/sez-region-profile/image/pimSd5gPfbNL3qYnBOuS9iWEANwdQix3pdHPBuZS.png?X-Amz-Content-Sha256=UNSIGNED-PAYLOAD\u0026X-Amz-Algorithm=AWS4-HMAC-SHA256\u0026X-Amz-Credential=F83BDJnBXrZ3WHGbaupe%2F20261106%2Fap-southeast-1%2Fs3%2Faws4_request\u0026X-Amz-Date=20261106T014911Z\u0026X-Amz-SignedHeaders=host\u0026X-Amz-Expires=86400\u0026X-Amz-Signature=19a305e2091a15e764fe87f0757276d5b57754ab30bd14187dec2d1feb1cc76b","fileName":"Screenshot_7.png","signature":"","fileSize":1103660},"tablet":{"url":"https://object.kek.go.id/ekon-kek-prod-bucket/sez-region-profile/image/pimSd5gPfbNL3qYnBOuS9iWEANwdQix3pdHPBuZS-tab.png?X-Amz-Content-Sha256=UNSIGNED-PAYLOAD\u0026X-Amz-Algorithm=AWS4-HMAC-SHA256\u0026X-Amz-Credential=F83BDJnBXrZ3WHGbaupe%2F20261106%2Fap-southeast-1%2Fs3%2Faws4_request\u0026X-Amz-Date=20261106T014911Z\u0026X-Amz-SignedHeaders=host\u0026X-Amz-Expires=86400\u0026X-Amz-Signature=e170117a3346c9e5cd243c6a370f7c5554d40b77902194441af57332065f33a7","fileName":"Screenshot_7-tab.png","signature":
