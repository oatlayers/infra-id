ng dipercaya sebagai jelmaan dari Putri Mandalika. Perayaan ini merupakan budaya yang unik dan menarik wisatawan baik lokal maupun internasional.\\n\\nBerdasarkan potensi dan keunggulan yang ada, PT Pengembangan Pariwisata Indonesia (Persero) yang telah mengembangkan Nusa Dua Bali mengusulkan pembentukan KEK Mandalika. KEK Mandalika memiliki konsep pengembangan pariwisata berwawasan lingkungan dengan pembangunan obyek-obyek wisata dan daya tarik wisata yang selalu berorientasi kepada kelestarian nilai dan kualitas lingkungan hidup yang ada di masyarakat.\u0026quot;}\" data-sheets-userformat=\"{\u0026quot;2\u0026quot;:4993,\u0026quot;3\u0026quot;:{\u0026quot;1\u0026quot;:0},\u0026quot;10\u0026quot;:2,\u0026quot;11\u0026quot;:4,\u0026quot;12\u0026quot;:0,\u0026quot;15\u0026quot;:\u0026quot;Calibri\u0026quot;}\"\u003eTerletak di bagian Selatan Pulau Lombok, KEK Mandalika ditetapkan melalui Peraturan Pemerintah Nomor 52 Tahun 2014 untuk menjadi KEK Pariwisata. Dengan luas area sebesar 1.035,67 Ha dan menghadap Samudera Hindia, KEK Mandalika diharapkan dapat mengakselerasi sektor pariwisata Provinsi Nusa Tenggara Barat yang sangat potensial.\u003cbr /\u003e\u003cbr /\u003eKEK Mandalika menawarkan wisata bahari dengan pesona pantai dan bawah laut yang memukau. Mandalika berasal dari nama seorang tokoh legenda, yaitu Putri Mandalika yang dikenal dengan parasnya yang cantik. Setiap tahunnya, masyarakat Lombok Tengah merayakan upacara Bau Nyale, yaitu ritual mencari cacing laut yang dipercaya sebagai jelmaan dari Putri Mandalika. Perayaan ini merupakan budaya yang unik dan menarik wisatawan baik lokal maupun internasional.\u003cbr /\u003e\u003cbr /\u003eBerdasarkan potensi dan keunggulan yang ada, PT Pengembangan Pariwisata Indonesia (Persero) yang telah mengembangkan Nusa Dua Bali mengusulkan pembentukan KEK Mandalika. KEK Mandalika memiliki konsep pengembangan pariwisata berwawasan lingkungan dengan pembangunan obyek-obyek wisata dan daya tarik wisata yang selalu berorient
