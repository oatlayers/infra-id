, Tanjung Lesung memiliki bentuk dataran pantai wilayah yang menjorok ke laut dan mirip lesung. Dengan pantai dengan pasir putih serta laut yang jernih, KEK Tanjung Lesung telah menarik baik wisatawan nasional maupun internasional. KEK Tanjung lesung diproyeksikan menarik investasi sebesar Rp.92,4T dan diproyeksikan dapat menyerap tenaga kerja sebanyak 85.000 tenaga kerja hingga tahun 2025.\u003c/span\u003e\u003c/p\u003e","legalBasis":"Peraturan Pemerintah (PP) Nomor 26 Tahun 2012","imageFiles":{"desktop":{"url":"https://object.kek.go.id/ekon-kek-prod-bucket/sez-region-profile/image/23CqTBMKYyO9AcuYSqGKP8nHAPJKaWBYEBVdt1Di.jpg?X-Amz-Content-Sha256=UNSIGNED-PAYLOAD\u0026X-Amz-Algorithm=AWS4-HMAC-SHA256\u0026X-Amz-Credential=F83BDJnBXrZ3WHGbaupe%2F20261106%2Fap-southeast-1%2Fs3%2Faws4_request\u0026X-Amz-Date=20261106T022621Z\u0026X-Amz-SignedHeaders=host\u0026X-Amz-Expires=86400\u0026X-Amz-Signature=13b194d25ccd8d85517a296023e6f68704f2a64e94dd7e93453e6c8614014d02","fileName":"Untitled-1.jpg","signature":"","fileSize":1019994},"tablet":{"url":"https://object.kek.go.id/ekon-kek-prod-bucket/sez-region-profile/image/23CqTBMKYyO9AcuYSqGKP8nHAPJKaWBYEBVdt1Di-tab.jpg?X-Amz-Content-Sha256=UNSIGNED-PAYLOAD\u0026X-Amz-Algorithm=AWS4-HMAC-SHA256\u0026X-Amz-Credential=F83BDJnBXrZ3WHGbaupe%2F20261106%2Fap-southeast-1%2Fs3%2Faws4_request\u0026X-Amz-Date=20261106T022621Z\u0026X-Amz-SignedHeaders=host\u0026X-Amz-Expires=86400\u0026X-Amz-Signature=32c53abbcebb94613be936f5bc13a5818f8c246c5ae5acff5b2c83ea75608f67","fileName":"Untitled-1-tab.jpg","signature":"","fileSize":147445},"mobile":{"url":"https://object.kek.go.id/ekon-kek-prod-bucket/sez-region-profile/image/23CqTBMKYyO9AcuYSqGKP8nHAPJKaWBYEBVdt1Di-mob.jpg?X-Amz-Content-Sha256=UNSIGNED-PAYLOAD\u0026X-Amz-Algorithm=AWS4-HMAC-SHA256\u0026X-Amz-Credential=F83BDJnBXrZ3WHGbaupe%2F20261106%2Fap-southeast-1%2Fs3%2Faws4_request\u0026X-Amz-Date=20261106T022621Z\u0026X-Amz-SignedHeaders=host\u0026X-Amz-Expires=86400\u0026X-Amz-Signature=10
