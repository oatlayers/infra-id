ahun 2014. KEK Bitung memiliki lokasi yang sangat strategis dan merupakan pintu gerbang ekonomi ke negara-negara di Asia Pasifik. Aksesibilitas tersebut didukung dengan adanya Pelabuhan Hub Internasional Bitung sebagai hub perdagangan bagi Kawasan Timur Indonesia. Berjarak 44 km dari Ibukota Manado, KEK Bitung diharapkan dapat menjadi pusat pertumbuhan dan distribusi barang serta penunjang logistik di kawasan timur Indonesia. Dengan total area seluas 534 ha, KEK Bitung berbasis pada keunggulan komoditas daerah Provinsi Sulawesi Utara. Sebagai salah satu penghasil ikan terbesar di Indonesia, KEK Bitung fokus pada industri pengolahan perikanan untuk menghasilkan komoditi ekspor berkualitas internasional. Selain perikanan, KEK Bitung juga fokus pada industri kelapa beserta produk turunannya yang memiliki pasar yang sangat luas dan diminati baik dalam skala nasional maupun internasional. Berdasarkan potensi wilayah dan keunggulan geostrategis, KEK Bitung diharapkan mendorong hilirisasi dan mendongkrak daya saing sektor perikanan, agro, farmasi dan diproyeksikan menarik investasi sebesar Rp.32,89T dan diproyeksikan dapat menyerap tenaga kerja sebanyak 34.710 tenaga kerja hingga tahun 2025.\u003c/span\u003e\u003c/p\u003e","legalBasis":"Peraturan Pemerintah Nomor 32 Tahun 2014","imageFiles":{"desktop":{"url":"https://object.kek.go.id/ekon-kek-prod-bucket/sez-region-profile/image/KBs9jzE3hZFMLy7Ka0yjKu4HuHbkC6mOX0d0QM7q.jpg?X-Amz-Content-Sha256=UNSIGNED-PAYLOAD\u0026X-Amz-Algorithm=AWS4-HMAC-SHA256\u0026X-Amz-Credential=F83BDJnBXrZ3WHGbaupe%2F20261106%2Fap-southeast-1%2Fs3%2Faws4_request\u0026X-Amz-Date=20261106T024014Z\u0026X-Amz-SignedHeaders=host\u0026X-Amz-Expires=86400\u0026X-Amz-Signature=50dfd4afd37dc53d695ba55d05f2034a4696636d7b5f7dd1989e0a8b781b34f1","fileName":"Master-Plan-Bitung.jpg","signature":"","fileSize":241184},"tablet":{"url":"https://object.kek.go.id/ekon-kek-prod-bucket/sez-region-profile/image/KBs9jzE3hZFMLy7Ka0yjKu4HuHbkC6mOX0d0QM7q-tab.jpg?X-Amz-Conte
