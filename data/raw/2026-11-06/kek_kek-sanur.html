ota Denpasar, Provinsi Bali. KEK Sanur ditetapkan melalui Peraturan Pemerintah Nomor 41 Tahun 2022 untuk menjadi KEK Kesehatan dan KEK Pariwisata. Dengan luas area sebesar 41,26 Ha dan berada tepat di tepi Pantai Sanur dan Pantai Segara Ayu. KEK Sanur diharapkan dapat mengakselerasi sektor Kesehatan dan juga sektor Pariwisata pada Provinsi Bali.\u003c/p\u003e\r\n\u003cp\u003eKEK Sanur memiliki konsep pengembangan Kesehatan dan menjadi KEK Kesehatan pertama di Indonesia sekaligus menjadi KEK Pariwisata yang berorientasi kepada nuansa alam dan memaparkan keindahan Pantai yang terdapat di Sanur, Pulau Bali.\u003c/p\u003e","legalBasis":"Peraturan Pemerintah Nomor 41 Tahun 2022","imageFiles":{"desktop":{"url":"https://object.kek.go.id/ekon-kek-prod-bucket/sez-region-profile/image/skXh91CoPGdUB6ZmCmHQPQdbTMOA2ntmTDsVZgFE.jpg?X-Amz-Content-Sha256=UNSIGNED-PAYLOAD\u0026X-Amz-Algorithm=AWS4-HMAC-SHA256\u0026X-Amz-Credential=F83BDJnBXrZ3WHGbaupe%2F20261106%2Fap-southeast-1%2Fs3%2Faws4_request\u0026X-Amz-Date=20261106T021237Z\u0026X-Amz-SignedHeaders=host\u0026X-Amz-Expires=86400\u0026X-Amz-Signature=5c3f0d1b040daa1e6e8815064313539aeabb7222cef93bea8e26d281f8cb26a5","fileName":"Masterplan-KEK-Sanur.jpg","signature":"","fileSize":802684},"tablet":{"url":"https://object.kek.go.id/ekon-kek-prod-bucket/sez-region-profile/image/skXh91CoPGdUB6ZmCmHQPQdbTMOA2ntmTDsVZgFE-tab.jpg?X-Amz-Content-Sha256=UNSIGNED-PAYLOAD\u0026X-Amz-Algorithm=AWS4-HMAC-SHA256\u0026X-Amz-Credential=F83BDJnBXrZ3WHGbaupe%2F20261106%2Fap-southeast-1%2Fs3%2Faws4_request\u0026X-Amz-Date=20261106T021237Z\u0026X-Amz-SignedHeaders=host\u0026X-Amz-Expires=86400\u0026X-Amz-Signature=a4144f5a54d5ba3e84675ff9b78724b0155d77dcf89f91fd73045d2167cd2579","fileName":"Masterplan-KEK-Sanur-tab.jpg","signature":"","fileSize":128960},"mobile":{"url":"https://object.kek.go.id/ekon-kek-prod-bucket/sez-region-profile/image/skXh91CoPGdUB6ZmCmHQPQdbTMOA2ntmTDsVZgFE-mob.jpg?X-Amz-Content-Sha256=UNSIGNED-PAYLOAD\u0026X-Amz-Algorithm=AWS4
