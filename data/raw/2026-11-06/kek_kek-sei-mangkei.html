true,"code":"200","message":"OK","data":{"xid":"GDDN9GE1","slug":"kek-sei-mangkei","description":"\u003cp\u003e\u003cspan style=\"font-size: 10pt; font-family: Calibri, Arial;\" data-sheets-root=\"1\" data-sheets-value=\"{\u0026quot;1\u0026quot;:2,\u0026quot;2\u0026quot;:\u0026quot;Kawasan  Ekonomi  Khusus  (KEK)  Sei  Mangkei ditetapkan  melalui  Peraturan  Pemerintah Nomor  29  Tahun  2012  pada  tanggal  27 Februari 2012 dan merupakan KEK pertama di Indonesia  yang  telah diresmikan beroperasi oleh  Presiden  Joko  Widodo  pada  27  Januari 2015.  KEK Sei Mangkei yang berlokasi di Provinsi Sumatera Utara memiliki kegiatan utama berupa industri pengolahan kelapa sawit, pengolahan karet, pariwisata dan logistik. KEK Sei Mangkei difokuskan untuk menjadi pusat pengembangan industri kelapa sawit dan karet hilir berskala besar dan berkualitas internasional. \\n\\nSebagai kawasan industri yang berada di sentra bahan baku berbasis agro dan dekat dengan Selat Malaka, KEK Sei Mangkei juga memiliki bisnis pendukung yaitu logistik dan pariwisata. Dengan total luas lahan sebesar 2.002,7 ha, KEK Sei Mangkei terbuka akan potensi industri lainnya terutama di sektor hilir dengan nilai tambah yang tinggi.\\n\\nKEK Sei Mangkei didukung dengan infrastruktur di dalam dan luar kawasan. Akses dari KEK Sei Mangkei ke jalan lintas Sumatera kurang lebih 10 km, jarak ke Pelabuhan Kuala Tanjung kurang lebih 40 km dan jarak ke Bandara Internasional Kualanamu kurang lebih 110 km.\\n\\nKEK Sei Mangkei ini diproyeksikan dapat menarik total investasi sebesar Rp129 triliun dan menyerap tenaga kerja sebanyak 83.304 Orang pada tahun 2031.\u0026quot;}\" data-sheets-userformat=\"{\u0026quot;2\u0026quot;:4993,\u0026quot;3\u0026quot;:{\u0026quot;1\u0026quot;:0},\u0026quot;10\u0026quot;:2,\u0026quot;11\u0026quot;:4,\u0026quot;12\u0026quot;:0,\u0026quot;15\u0026quot;:\u0026quot;Calibri\u0026quot;}\"\u003eKawasan Ekonomi Khusus (KEK) Sei Mangkei ditetapkan melalui Peraturan Pemerintah Nomor 29 Tahun 2012 pada tanggal 27 Februari 2012 dan merupakan KEK pertama di Indonesia yang telah diresmikan beroperasi oleh Presiden Joko Widodo pada 27 Januari 2015. KEK Sei Mangkei yang berlokasi di Provinsi Sumatera Utara memiliki kegiatan utama berupa industri pengolahan kelapa sawit, pengolahan karet, pariwisata dan logistik. KEK Sei Mangkei difokuskan untuk menjadi pusat pengembangan industri kelapa sawit dan karet hilir berskala besar dan berkualitas internasional.\u003cbr /\u003e\u003cbr /\u003eSebagai kawasan industri yang berada di sentra bahan baku berbasis agro dan dekat dengan Selat Malaka, KEK Sei Mangkei juga memiliki bisnis pendukung yaitu logistik dan pariwisata. Dengan total luas lahan sebesar 2.002,7 ha, KEK Sei Mangkei terbuka akan potensi industri lainnya terutama di sektor hilir dengan nilai tambah yang tinggi.\u003cbr /\u003e\u003cbr /\u003eKEK Sei Mangkei didukung dengan infrastruktur di dalam dan luar kawasan. Akses dari KEK Sei Mangkei ke jalan lintas Sumatera kurang lebih 10 km, jarak ke Pelabuhan Kuala Tanjung kurang lebih 40 km dan jarak ke Bandara Internasional Kualanamu kurang lebih 110 km.\u003cbr /\u003e\u003cbr /\u003eKEK Sei Mangkei ini diproyeksikan dapat menarik total investasi sebesar Rp129 triliun dan menyerap tenaga kerja sebanyak 83.304 Orang pada tahun 2031.\u003c/span\u003e\u003c/p\u003e","legalBasis":"PP No 29 Tahun 2012","imageFiles":{"desktop":{"url":"https://object.kek.go.id/ekon-kek-prod-bucket/sez-region-profile/image/J4zuJ1lDUUujN9cQ3zRzUvotZgbnVy92AlZ5w8hZ.jpg?X-Amz-Content-Sha256=UNSIGNED-PAYLOAD\u0026X-Amz-Algorithm=AWS4-HMAC-SHA256\u0026X-Amz-Credential=F83BDJnBXrZ3WHGbaupe%2F20261106%2Fap-southeast-1%2Fs3%2Faws4_request\u0026X-Amz-Date=20261106T020343Z\u0026X-Amz-SignedHeaders=host\u0026X-Amz-Expires=86400\u0026X-Amz-Signature=4117223430a9caa235f21c347ca6eac8a40c6950a494a65a73e11ebb054eb417","fileName":"Masterplan-KEK-Sei-Mangkei.jpg","signature":"","fileSize":318569},"tablet":{"url":"https://object.kek.go.id/ekon-kek-prod-bucke
