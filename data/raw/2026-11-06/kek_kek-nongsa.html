3e\r\n\u003cp\u003e\u003cspan style=\"font-size: 10pt; font-family: Calibri, Arial;\" data-sheets-root=\"1\" data-sheets-value=\"{\u0026quot;1\u0026quot;:2,\u0026quot;2\u0026quot;:\u0026quot;KEK Nongsa berada di kota Batam provinsi Kepulauan Riau dan diresmikan dengan Peraturan Pemerintah nomor 68 tahun 2021. Letaknya yang dekat dengan Singapura dan manca negara membuat KEK Nongsa sebagai entry point bagi perusahaan IT Internasional.\\nTidak hanya menarik perhatian investor di bidang IT, KEK Nongsa juga menarik perhatian investor dan wisatawan luar dan dalam negeri dengan adanya kegiatan pendukung berupa pariwisata seperti hunian sinematik, villa residential, caf\u0026eacute; restoran, ferry terminal, serta area komersial dan entertainment. \u0026quot;}\" data-sheets-userformat=\"{\u0026quot;2\u0026quot;:4993,\u0026quot;3\u0026quot;:{\u0026quot;1\u0026quot;:0},\u0026quot;10\u0026quot;:2,\u0026quot;11\u0026quot;:4,\u0026quot;12\u0026quot;:0,\u0026quot;15\u0026quot;:\u0026quot;Calibri\u0026quot;}\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e","legalBasis":"PP no 68 Tahun 2021","imageFiles":{"desktop":{"url":"https://object.kek.go.id/ekon-kek-prod-bucket/sez-region-profile/image/39YR5Lp4AP9QBrn2eXMIdROat7TTCcHUrzwYB7pz.jpg?X-Amz-Content-Sha256=UNSIGNED-PAYLOAD\u0026X-Amz-Algorithm=AWS4-HMAC-SHA256\u0026X-Amz-Credential=F83BDJnBXrZ3WHGbaupe%2F20261106%2Fap-southeast-1%2Fs3%2Faws4_request\u0026X-Amz-Date=20261106T020456Z\u0026X-Amz-SignedHeaders=host\u0026X-Amz-Expires=86400\u0026X-Amz-Signature=bb59c7601687ad94cb07a2f120b0f7baccc2cfbfb3cf475ef96bb46759d82475","fileName":"MP Nongsa Sep 2023 new.jpg","signature":"","fileSize":289278},"tablet":{"url":"https://object.kek.go.id/ekon-kek-prod-bucket/sez-region-profile/image/39YR5Lp4AP9QBrn2eXMIdROat7TTCcHUrzwYB7pz-tab.jpg?X-Amz-Content-Sha256=UNSIGNED-PAYLOAD\u0026X-Amz-Algorithm=AWS4-HMAC-SHA256\u0026X-Amz-Credential=F83BDJnBXrZ3WHGbaupe%2F20261106%2Fap-southeast-1%2Fs3%2Faws4_request\u0026X-Amz-Date=20261106T020456Z\u00
