description":"\u003cp\u003e\u003cspan style=\"font-size: 10pt; font-family: Calibri, Arial;\" data-sheets-root=\"1\" data-sheets-value=\"{\u0026quot;1\u0026quot;:2,\u0026quot;2\u0026quot;:\u0026quot;KEK Tanjung Kelayang ditetapkan melalui Peraturan Pemerintah Nomor 6 Tahun 2016 dan berlokasi di Pulau Belitung. KEK Pariwisata ini memiliki keunggulan geostrategis, yaitu terletak antara Indonesia dan negara ASEAN yang merupakan target captive market. \\n\\nKEK yang diresmikan oleh Presiden Republik Indonesia pada 14 Maret 2019 ini termasuk ke dalam 10 destinasi pariwisata prioritas. Memiliki objek wisata bahari dengan pantai berpasir putih dan panorama yang eksotis. Pantai yang dihiasi batuan granit raksasa merupakan ciri khas dari pantai di kawasan ini. Kawasan ini berdekatan dengan pulau-pulau kecil disekitarnya yang juga memiliki pesonanya tersendiri. \\n\\nDengan total luas wilayah sebesar 324,4 Ha, KEK Tanjung Kelayang memiliki konsep pengembangan pariwisata \\\u0026quot;Socially and Environmentally Responsible Development and Cultural Preservation\u0026rdquo;. Dengan konsep pengembangan pariwisata berkelanjutan dan berwawasan lingkungan, KEK ini diproyeksikan dapat menarik investasi sebesar Rp. 10,3T dan proyeksi  tenaga kerja sebanyak 5.000 orang pada tahun 2036. \u0026quot;}\" data-sheets-userformat=\"{\u0026quot;2\u0026quot;:4993,\u0026quot;3\u0026quot;:{\u0026quot;1\u0026quot;:0},\u0026quot;10\u0026quot;:2,\u0026quot;11\u0026quot;:4,\u0026quot;12\u0026quot;:0,\u0026quot;15\u0026quot;:\u0026quot;Calibri\u0026quot;}\"\u003eKEK Tanjung Kelayang ditetapkan melalui Peraturan Pemerintah Nomor 6 Tahun 2016 dan berlokasi di Pulau Belitung. KEK Pariwisata ini memiliki keunggulan geostrategis, yaitu terletak antara Indonesia dan negara ASEAN yang merupakan target captive market.\u003cbr /\u003e\u003cbr /\u003eKEK yang diresmikan oleh Presiden Republik Indonesia pada 14 Maret 2019 ini termasuk ke dalam 10 destinasi pariwisata prioritas. Memiliki objek wisata bahari dengan pantai berpasir putih dan panorama yang eksotis. Pantai yang dihiasi batuan granit raksasa merupakan ciri khas dari pantai di kawasan ini. Kawasan ini berdekatan dengan pulau-pulau kecil disekitarnya yang juga memiliki pesonanya tersendiri.\u003cbr /\u003e\u003cbr /\u003eDengan total luas wilayah sebesar 324,4 Ha, KEK Tanjung Kelayang memiliki konsep pengembangan pariwisata \"Socially and Environmentally Responsible Development and Cultural Preservation\u0026rdquo;. Dengan konsep pengembangan pariwisata berkelanjutan dan berwawasan lingkungan, KEK ini diproyeksikan dapat menarik investasi sebesar Rp. 10,3T dan proyeksi tenaga kerja sebanyak 5.000 orang pada tahun 2036.\u003c/span\u003e\u003c/p\u003e","legalBasis":"PP No 6 Tahun 2016","imageFiles":{"desktop":{"url":"https://object.kek.go.id/ekon-kek-prod-bucket/sez-region-profile/image/WXjh9Mn1XGeL5hMZJ8nZbvNIu8oT9RsGsKyaBvnn.jpg?X-Amz-Content-Sha256=UNSIGNED-PAYLOAD\u0026X-Amz-Algorithm=AWS4-HMAC-SHA256\u0026X-Amz-Credential=F83BDJnBXrZ3WHGbaupe%2F20261106%2Fap-southeast-1%2Fs3%2Faws4_request\u0026X-Amz-Date=20261106T085412Z\u0026X-Amz-SignedHeaders=host\u0026X-Amz-Expires=86400\u0026X-Amz-Signature=5d3619141f6ea108ca6165ae3b05662de0286775b4b790af673000fa49835901","fileName":"Masterplan-KEK-Tanjung-Kelayang.jpg","signature":"","fileSize":289097},"tablet":{"url":"https://object.kek.go.id/ekon-kek-prod-bucket/sez-region-profile/image/WXjh9Mn1XGeL5hMZJ8nZbvNIu8oT9RsGsKyaBvnn-tab.jpg?X-Amz-Content-Sha256=UNSIGNED-PAYLOAD\u0026X-Amz-Algorithm=AWS4-HMAC-SHA256\u0026X-Amz-Credential=F83BDJnBXrZ3WHGbaupe%2F20261106%2Fap-southeast-1%2Fs3%2Faws4_request\u0026X-Amz-Date=20261106T085412Z\u0026X-Amz-SignedHeaders=host\u0026X-Amz-Expires=86400\u0026X-Amz-Signature=8799fbaa9e80be4caa241ae5796b0916283b147c32854cf128f32eb109f360cc","fileName":"Masterplan-KEK-Tanjung-Kelayang-tab.jpg","signature":"","fileSize":56146},"mobile":{"url":"https://object.kek.go.id/ekon-kek-prod-bucket/sez-region-profile/image/WXjh9Mn1XGeL5hMZJ8nZbvNIu8o
