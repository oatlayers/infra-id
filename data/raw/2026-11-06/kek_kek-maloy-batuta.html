ge":"OK","data":{"xid":"IL2HNTNA","slug":"kek-maloy-batuta","description":"\u003cp\u003e\u003cspan style=\"font-family: docs-Calibri; font-size: 13px; white-space-collapse: preserve; background-color: #ffffff;\"\u003eBerlokasi di Kabupaten Kutai Timur, Provinsi Kalimantan Timur, KEK Maloy Batuta Trans Kalimantan ditetapkan melalui Peraturan Pemerintah Nomor 85 Tahun 2014. Kawasan ini kaya akan sumber daya alam terutama kelapa sawit, kayu dan energi didukung dengan posisi geostrategis yaitu terletak pada lintasan Alur Laut Kepulauan Indonesia II (ALKI II). ALKI II merupakan lintasan laut perdagangan internasional yang menghubungkan Pulau Kalimantan dan Sulawesi, serta merupakan jalur regional lintas trans Kalimantan, dan transportasi penyeberangan ferry Tarakan-Tolitoli, dan Balikpapan-Mamuju. \u003c/span\u003e\u003cbr style=\"font-family: docs-Calibri; font-size: 13px; white-space-collapse: preserve;\" /\u003e\u003cbr style=\"font-family: docs-Calibri; font-size: 13px; white-space-collapse: preserve;\" /\u003e\u003cspan style=\"font-family: docs-Calibri; font-size: 13px; white-space-collapse: preserve; background-color: #ffffff;\"\u003eKEK MBTK diharapkan dapat mendorong penciptaan nilai tambah melalui industrialisasi atas berbagai komoditi di wilayah tersebut. Berdasarkan keunggulan geostrategis wilayah Kutai Timur, KEK MBTK akan menjadi pusat pengolahan kelapa sawit dan produk turunannya, serta pusat bagi industri energi seperti industri mineral, gas dan batu bara. \u003c/span\u003e\u003cbr style=\"font-family: docs-Calibri; font-size: 13px; white-space-collapse: preserve;\" /\u003e\u003cbr style=\"font-family: docs-Calibri; font-size: 13px; white-space-collapse: preserve;\" /\u003e\u003cspan style=\"font-family: docs-Calibri; font-size: 13px; white-space-collapse: preserve; background-color: #ffffff;\"\u003eKEK MBTK ini diproyeksikan menarik investasi sebesar Rp.34,4T dan diproyeksikan dapat menyerap tenaga kerja sebanyak 55.700 tenaga kerja hingga tahun 2025.\u0
