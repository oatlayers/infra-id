<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Indonesia Infrastructure Atlas</title>
<meta name="description" content="A curated, source-linked atlas of major Indonesian infrastructure and PSN programmes: roads, railways, airports, seaports, factories, energy, water, urban and coastal projects that are operating, under construction, planned or stalled.">
<meta name="theme-color" content="#0b1f33">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230b1f33'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23f3c99a' stroke-width='1.5'/%3E%3Cpath d='m21 11-3 7-7 3 3-7 7-3Z' fill='%23f3c99a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
<link rel="stylesheet" href="vendor/markercluster/MarkerCluster.Default.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<a class="skip-link" href="#project-list">Skip to project list</a>

</svg>

<header class="app-header">
  <a class="brand" href="#/explore" aria-label="Indonesia Infrastructure Atlas — Explore">
    <span class="brand-mark"><svg><use href="#i-compass"/></svg></span>
    <span class="brand-text">
      <span class="brand-name">Indonesia Infrastructure Atlas</span>
      <span class="brand-sub">Curated · sourced · offline</span>
    </span>
  </a>

  <div class="header-search">
    <svg aria-hidden="true"><use href="#i-search"/></svg>
    <label class="sr-only" for="search">Search projects, programmes, provinces, corridors and estates</label>
    <input id="search" type="search" placeholder="Search projects, programmes, provinces…" autocomplete="off" spellcheck="false">
    <kbd aria-hidden="true">Ctrl K</kbd>
  </div>

  <div class="header-meta">
    <div class="header-stat"><span>Projects</span><strong id="stat-projects">—</strong></div>
    <div class="header-stat"><span>Corridors</span><strong id="stat-corridors">—</strong></div>
    <div class="header-stat"><span>Estates &amp; SEZs</span><strong id="stat-estates">—</strong></div>
    <a class="header-link" href="#/data"><svg aria-hidden="true"><use href="#i-database"/></svg> Data</a>
  </div>
</header>

<main class="app-main">
  <aside class="rail" id="rail" aria-label="Explore and filters">
    <button class="sheet-handle" id="sheet-handle" type="button" aria-label="Resize panel" aria-controls="rail-body"></button>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button class="tab" role="tab" data-view="explore" aria-selected="true" aria-controls="rail-body">Explore<span class="tab-count" id="tab-count-explore"></span></button>
      <button class="tab" role="tab" data-view="programmes" aria-selected="false" aria-controls="rail-body">Programmes<span class="tab-count" id="tab-count-programmes"></span></button>
      <button class="tab" role="tab" data-view="corridors" aria-selected="false" aria-controls="rail-body">Corridors</button>
      <button class="tab" role="tab" data-view="estates" aria-selected="false" aria-controls="rail-body">Estates</button>
      <button class="tab" role="tab" data-view="data" aria-selected="false" aria-controls="rail-body">Data</button>
    </nav>

    <div class="rail-body" id="rail-body">
      <div class="explore-content" id="explore-content">
      <div class="rail-tools" id="rail-tools">
        <div class="filter-label">Sector</div>
        <div class="chip-row" id="sector-chips"></div>
        <div class="filter-label">Status</div>
        <div class="chip-row" id="status-chips"></div>
        <div class="filter-actions">
          <button class="filter-button" id="more-filters" aria-expanded="false" aria-controls="filter-popover">
            <svg aria-hidden="true"><use href="#i-filter"/></svg> More filters
            <span class="filter-badge" id="filter-badge" hidden>0</span>
          </button>
          <button class="filter-clear" id="clear-filters" hidden>Clear all</button>
        </div>
        <div class="filter-popover" id="filter-popover" hidden>
          <div class="filter-grid" id="filter-grid"></div>
          <div class="popover-foot">
            <span id="popover-summary">All projects</span>
            <button class="filter-clear" id="popover-close">Done</button>
          </div>
        </div>
      </div>
      <div class="active-filters" id="active-filters" hidden></div>
      <div class="list-meta">
        <span id="result-count" aria-live="polite">Loading…</span>
        <label class="sort">Sort
          <select id="sort" aria-label="Sort projects">
            <option value="status">Status</option>
            <option value="name">Name A–Z</option>
            <option value="verified">Recently verified</option>
            <option value="length">Longest</option>
            <option value="progress">Progress</option>
          </select>
        </label>
      </div>
      <div class="list-scroll" id="list-scroll">
        <ul class="project-list" id="project-list" tabindex="-1"></ul>
      </div>
      <div class="rail-foot" id="rail-foot">
        <span><strong id="foot-count">—</strong> of <span id="foot-total">—</span> projects shown</span>
        <a class="foot-link" href="#/data">Coverage &amp; methods →</a>
      </div>
      </div>
      <div class="view-scroll" id="view-panel" tabindex="0" hidden></div>
    </div>
  </aside>

  <div class="map-wrap">
    <div id="map" role="region" aria-label="Map of Indonesian infrastructure projects"></div>
    <div class="map-caption"><svg aria-hidden="true" width="11" height="11"><use href="#i-place"/></svg><strong id="map-count">—</strong> projects · Indonesia</div>
    <details class="layer-control">
      <summary>Layers</summary>
      <div class="layer-body">
        <label class="layer-row"><input type="checkbox" id="layer-projects" checked> Projects</label>
        <label class="layer-row"><input type="checkbox" id="layer-labels" checked> City labels</label>
        <label class="layer-row is-disabled"><input type="checkbox" disabled> Estates <small>Table only</small></label>
        <label class="layer-row is-disabled"><input type="checkbox" disabled> Corridor lines <small>Geometry pending</small></label>
      </div>
    </details>
    <details class="map-legend" open>
      <summary>Legend</summary>
      <div class="legend-body" id="legend-body"></div>
    </details>
  </div>
</main>

<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
  <div class="drawer-head">
    <div class="drawer-topline" id="drawer-topline">
      <div class="drawer-pills" id="drawer-pills"></div>
      <button class="drawer-close" id="drawer-close" aria-label="Close details"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <h2 id="drawer-title"></h2>
    <p class="drawer-loc" id="drawer-loc"></p>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-foot" id="drawer-foot"></div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/markercluster/leaflet.markercluster.js"></script>
<script src="data/basemap.js"></script>
<script src="data/projects.js"></script>
<script src="data/corridors.js"></script>
<script src="data/stats.js"></script>
<script src="data/search.js"></script>
<script src="assets/constants.js"></script>
<script src="assets/map.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
